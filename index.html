<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PalmPay Clone</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="nav_section">
    <nav>
      <div class="palmpay-logo">
        <a href="#"><img src="IMAGES/PALMPAY LOGO.png" alt="PalmPay"></a>
      </div>

      <ul>
        <li><a href="#" class="active">Company</a></li>
        <li><a href="#">Personal</a></li>
        <li><a href="#">Business</a></li>
        <li><a href="#">Impact</a></li>
        <li><a href="#">Newsroom</a></li>
      </ul>

      <div class="nav_right">
        <button class="btn">Log In</button>

        <div class="country-select">
          <span class="flag">🇳🇬</span>
          <select id="country" name="country">
            <option value="nigeria">Nigeria</option>
            <option value="ghana">Ghana</option>
            <option value="kenya">Kenya</option>
            <option value="south-africa">South Africa</option>
            <option value="cameroon">Cameroon</option>
            <option value="egypt">Egypt</option>
            <option value="canada">Canada</option>
            <option value="usa">United States</option>
            <option value="uk">United Kingdom</option>
          </select>
        </div>
      </div>
    </nav>
  </div>

  <div class="parent0">
    <div class="child0">
      <div class="header">
        The Smarter Way
      </div>
      <div class="header">
        to Bank is Here
      </div>
      <div class="text">Tools to help you pay, earn, save and</div>
      <div class="text">grow - all in one app</div>
      <div class="download-logos">
        <div class="downlg"><img src="IMAGES/APP STORE.png" alt="App Store"></div>
        <div class="downlg"><img src="IMAGES/PLAY STORE.png" alt="Play Store"></div>
      </div>

      <div class="license">
        <div class="license-logo">Licenced by the CBN</div>
        <div class="license-logo"><img src="IMAGES/CBN LOGO.png" alt=""></div>
        <div class="license-logo">Deposits insured by</div>
        <div class="license-logo"><img src="IMAGES/NDIC LOGO.png" alt=""></div>
      </div>
    </div>

    <div class="child0">
      <img src="IMAGES/PALMPAY AD IMAGE.png" alt="PalmPay App">
    </div>
  </div>
  <div class="underlay">
    <div class="underlay-img"><img src="IMAGES/reviews.png" alt=""></div>
  </div>

</body>

</html>
